<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運営者情報 | むし暦</title><meta name="description" content="むし暦の運営者情報"><link rel="canonical" href="https://naoo047.github.io/mushigoyomi/about/"><link rel="stylesheet" href="../style.css"></head><body><header class="site"><a href="../">むし暦</a></header><main class="wrap"><h1>運営者情報</h1><p>むし暦は、身近な虫が出る時期を地域ごとに調べられるよう、個人で運営しているサイトです。</p><p>時期は、自治体などの公開資料に書かれた時期を出発点に、気象庁の平年値で各地の気温に合わせて計算しています。使った資料は各ページの「根拠」に載せています。</p><p>内容の誤りに気づかれた場合は、ページの下の資料もあわせてご確認ください。</p></main><footer class="site"><a href="../about/">運営者情報</a> ・ <a href="../privacy/">プライバシーポリシー</a><p>気温の出典：気象庁「平年値（統計期間1991〜2020年）」を加工して作成</p></footer></body></html>
