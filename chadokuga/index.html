  }
  function table(selected) {
    const head = `<thead><tr><th>都道府県</th>${DATA.phases.map((p) => `<th>${esc(p.label)}</th>`).join("")}</tr></thead>`;
    const n = DATA.phases.length;
    const body = DATA.regions.map((r) => `<tr class="region"><th colspan="${n + 1}">${esc(r.name)}</th></tr>` + r.prefs.map((p) => {
      const cells = p.hidden ? `<td class="na" colspan="${n}">${esc(p.hidden)}</td>`
        : p.phases.map((ph) => `<td>${ph.ranges.map((x) => esc(x.label)).join("、")}</td>`).join("");
      return `<tr class="${p.pref === selected ? "sel" : ""}"><th>${esc(p.pref)}</th>${cells}</tr>`;
    }).join("")).join("");
    $("all").innerHTML = head + `<tbody>${body}</tbody>`;
  }
  $("tips").innerHTML = DATA.content.tips.map((s) => `<li>${esc(s)}</li>`).join("");
  $("method").innerHTML = ALLFIXED
    ? "<p>国の資料に書かれた全国についての時期を、そのまま示しています。地域の気温ではずらしていません。</p>"
      + "<p>虫の出る時期は、その年の天候や周りの環境で変わります。目安として使い、実際の様子もあわせて確かめてください。</p>"
    : DATA.method.map((t) => `<p>${esc(t)}</p>`).join("")
    + `<p>この虫の時期の出発点は、${esc(DATA.ref_station)}の資料の値です。</p>`
    + (!ALLFIXED && DATA.phases.some((p) => p.fixed) ? `<p>「全国」と付いた時期は、気温でずらすと資料と合わなくなるため、地域でずらさずに資料の値をそのまま使っています。</p>` : "");
  $("sources").innerHTML = DATA.sources.map((s) => `<li>${esc(s.publisher)}「${esc(s.title)}」 <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></li>`).join("");

  if (ALLFIXED) {
    document.querySelector(".pick").style.display = "none";
    document.querySelector("details.all").style.display = "none";
    $("pick-h").textContent = "時期（全国）";
  }
  let current = "東京都";
  try { const saved = localStorage.getItem("mushi-pref"); if (saved && byName[saved]) current = saved; } catch (e) {}
  sel.value = current;
  function update() {
    current = sel.value;
    try { localStorage.setItem("mushi-pref", current); } catch (e) {}
    render(byName[current]);
    table(current);
  }
  sel.addEventListener("change", update);
  update();
})();
</script>
