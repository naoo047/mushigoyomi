  const ALLFIXED = DATA.phases.every((p) => p.fixed);
  const $ = (id) => document.getElementById(id);

  $("legend").innerHTML = DATA.phases.map((p) => `<span><i class="sw ${p.cls}"></i>${esc(p.label)}</span>`).join("");

  function bars(row, cls, start, end) {
    const a = dekad(start), b = dekad(end);
    const seg = (x, y) => `<div class="bar ${cls}" style="grid-row:${row};grid-column:${x + 2} / ${y + 3}"></div>`;
    return a <= b ? seg(a, b) : seg(a, 35) + seg(0, b);
  }
  function render(p) {
    if (p.hidden) {
      $("answer").innerHTML = `<p class="off">${esc(p.hidden)}</p>`;
      $("cal").innerHTML = "";
      return;
    }
    const rows = p.phases.map((ph) => `<dt>${esc(ph.label)}</dt><dd class="${ph.cls}">${ph.ranges.map((r) => esc(r.label)).join("、")}</dd>`).join("");

      h += `<div class="rl" style="grid-row:${i + 2}">${esc(ph.label)}</div>` + ph.ranges.map((r) => bars(i + 2, ph.cls, r.start, r.end)).join("");

  }

  if (ALLFIXED) {
    document.querySelector(".pick").style.display = "none";
    document.querySelector("details.all").style.display = "none";
    $("pick-h").textContent = "時期（全国）";
  }

  try { const saved = localStorage.getItem("mushi-pref"); if (saved && byName[saved]) current = saved; } catch (e) {}
  sel.value = current;
  function update() {
    current = sel.value;
    try { localStorage.setItem("mushi-pref", current); } catch (e) {}
    render(byName[current]);
    table(current);
  }
  sel.addEventListener("change", update);
  update();
})();
